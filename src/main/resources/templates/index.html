<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Organ Donation Registry Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { display: flex; gap: 40px; }
        .form-section, .list-section { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 50%;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Organ Donation Registry - Admin Dashboard</h2>
    
    <div class="container">
        <div class="form-section">
            <h3>Register New Donor</h3>
            <form th:action="@{/addDonor}" th:object="${donor}" method="post">
                <p>Full Name: <input type="text" th:field="*{fullName}" required/></p>
                <p>Blood Group: 
                    <select th:field="*{bloodGroup}">
                        <option value="A+">A+</option>
                        <option value="O-">O-</option>
                        <option value="B+">B+</option>
                        <option value="AB+">AB+</option>
                    </select>
                </p>
                <p>Tissue Type: <input type="text" th:field="*{tissueType}" required/></p>
                <p>Organ Pledged: 
                    <select th:field="*{organPledged}">
                        <option value="Kidney">Kidney</option>
                        <option value="Liver">Liver</option>
                        <option value="Heart">Heart</option>
                        <option value="Cornea">Cornea</option>
                    </select>
                </p>
                <button type="submit">Register Donor</button>
            </form>
        </div>

        <div class="list-section">
            <h3>Registered Donors</h3>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Blood Group</th>
                    <th>Organ Pledged</th>
                </tr>
                <tr th:each="d : ${donorsList}">
                    <td th:text="${d.fullName}"></td>
                    <td th:text="${d.bloodGroup}"></td>
                    <td th:text="${d.organPledged}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
